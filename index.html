<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a120e">
<title>드루이드 헌터즈 · 플레이어블 프로토타입</title>
<style>
:root{--tc:#e8a25c;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--txt:#e8efe9;--sub:#8fa197;--gold:#ffd166;--stone:#b3bec7;--sp:#7ee08a;--dia:#6fe3ff;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050807;color:var(--txt);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#000}
#lobby{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#1b3a26 0%,#0b150f 50%,#050807 100%)}
.shell{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;position:relative}
/* top */
.top{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:rgba(5,10,8,.6);backdrop-filter:blur(6px)}
.prof{display:flex;align-items:center;gap:10px}
.lvb{font-weight:800;font-size:15px;white-space:nowrap}
.expbar{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.expbar i{display:block;height:100%;background:linear-gradient(90deg,#7ee08a,#c8f58a);width:0}
.pw{font-size:12px;color:var(--sub);white-space:nowrap}.pw b{color:#fff;font-size:14px}
.cur{display:flex;gap:6px}
.cur span{flex:1;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 7px;font-weight:700;font-size:12.5px;min-width:0}
.cur b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:13px;height:13px;flex:none;display:inline-block}
.ic.gold{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc23d 60%,#b37a10)}
.ic.stone{background:linear-gradient(135deg,#dfe7ee,#7f8b96);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.ic.sp{border-radius:50%;background:radial-gradient(circle,#c8ffcf,#3fbf5a);box-shadow:0 0 6px #3fbf5a}
.ic.dia{background:linear-gradient(135deg,#d8fbff,#2bb8e0);transform:rotate(45deg) scale(.8);border-radius:2px}
/* content */
.content{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:6px}.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(6,11,9,.92);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.nav button{flex:1;padding:8px 0;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--sub);position:relative}
.nav button.on{color:#fff;background:var(--panel2)}
.nav button.on::after{content:"";position:absolute;left:30%;right:30%;top:2px;height:2px;border-radius:2px;background:var(--tc)}
.nav button.dis{opacity:.25;pointer-events:none}
.nav .dot{position:absolute;top:5px;right:18%;width:7px;height:7px;border-radius:50%;background:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h3 small{color:var(--sub);font-weight:500;font-size:11.5px;margin-left:auto}
.muted{color:var(--sub);font-size:12px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 60%,#000));border-color:transparent;color:#120c06}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:12px}
.btn.dia{background:linear-gradient(180deg,#58d6f5,#1b86a8);color:#04202a;border-color:transparent}
.btn.sm{padding:6px 9px;font-size:12px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:13px}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.chip.lock{opacity:.45}.chip.lock i{background:#555;box-shadow:none}
.chip small{font-size:10px;color:var(--sub);font-weight:500}
.hero{display:flex;gap:12px;align-items:center}
.hero canvas{width:110px;height:110px;flex:none;border-radius:14px;background:radial-gradient(circle,#18261e,#0a110d)}
.hero h2{font-size:18px}
.sk{font-size:12px;margin-top:3px;color:#cfd8d2}.sk.lock{color:#5e6a63}
.idle{display:flex;align-items:center;gap:10px}
.idle .chest{width:46px;height:46px;flex:none;border-radius:12px;background:linear-gradient(160deg,#6b4a22,#2e1f0e);border:2px solid #c99a4a;position:relative;box-shadow:0 0 18px rgba(255,190,90,.25)}
.idle .chest::after{content:"";position:absolute;left:4px;right:4px;top:15px;height:3px;background:#c99a4a}
.idle .info{flex:1;font-size:12.5px;line-height:1.55}
.idlebar{height:5px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-top:4px}.idlebar i{display:block;height:100%;background:linear-gradient(90deg,#ffb84d,#ffe08a)}
.chnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.chnav b{font-size:15px}.chnav small{color:var(--sub);font-size:11.5px;margin-left:6px}
.chnav button{width:34px;height:34px;border-radius:10px;background:var(--panel2);font-size:18px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stg{aspect-ratio:1.25;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.stg small{font-size:9.5px;color:var(--sub);font-weight:600}
.stg.clear{background:color-mix(in srgb,var(--tc) 12%,transparent)}
.stg.clear::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--sp)}
.stg.cur{border-color:#fff3;box-shadow:inset 0 0 0 1px #fff3}
.stg.lock{opacity:.3}
.stg.sel{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc)}
.stg.boss{color:#ff8a8a}.stg.mid{color:#ffcf7a}
.toggles{display:flex;gap:6px;margin-top:8px}
.tg{flex:1;padding:8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--sub)}
.tg.on{color:#fff;border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.coach{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,transparent),transparent);border:1px solid var(--tc);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:700;line-height:1.5}
/* tree */
.ttabs{display:flex;gap:6px;margin-bottom:10px}
.ttabs button{flex:1;padding:8px 0;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:12.5px}
.ttabs button.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.treewrap{position:relative;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);border-radius:14px}
svg.tree{width:100%;display:block}
svg.tree .nd{cursor:pointer}
svg.tree .pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ndinfo h4{font-size:15px;display:flex;align-items:center;gap:6px}
.typ{font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--panel2);font-weight:700}
.cost{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:12.5px;font-weight:700}
.cost span{display:flex;align-items:center;gap:4px}.cost .no{color:var(--red)}
/* equip */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.it{border-radius:11px;background:var(--panel);border:1.5px solid var(--gc,#444);padding:7px 5px;text-align:center;position:relative;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
.it .sl{font-size:10px;color:var(--sub)}
.it .nm{font-weight:800;font-size:11.5px;color:var(--gc);line-height:1.25}
.it .en{position:absolute;top:3px;right:5px;font-size:10.5px;font-weight:800;color:#fff}
.it .eq{position:absolute;bottom:4px;left:5px;font-size:9.5px;font-weight:800;background:var(--tc);color:#000;border-radius:4px;padding:0 3px}
.it.empty{border-style:dashed;border-color:#333;color:#555}
.it .od{display:flex;gap:2px;justify-content:center}.it .od i{width:6px;height:6px;border-radius:50%}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.setb{font-size:12px;margin-top:8px;line-height:1.6}
.setb .on{color:var(--sp);font-weight:700}
table.pt{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.pt th,table.pt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.pt th{color:var(--sub);font-weight:600}
.opt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;background:var(--panel);margin-bottom:5px;font-size:13px}
.opt .g{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.07)}
.opt .lk{margin-left:auto;font-size:11.5px;padding:4px 8px;border-radius:7px;background:var(--panel2);font-weight:700}
.opt .lk.on{background:#ffd166;color:#201600}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px}
.statgrid div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.statgrid span{color:var(--sub)}
.upg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.upg:last-child{border:0}
.upg .ui{flex:1}.upg .ui b{font-size:14px}.upg .ui div{font-size:12px;color:var(--sub);margin-top:2px}
.q{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.q:last-child{border:0}
.q .qi{flex:1;font-size:13px}.q .qi small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.qbar{height:5px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-top:5px}.qbar i{display:block;height:100%;background:var(--sp)}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.att div{border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:7px 2px;text-align:center;font-size:10.5px;line-height:1.35}
.att div b{display:block;font-size:11px}
.att .done{opacity:.4}.att .now{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.pack{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px;position:relative}
.pack .pi{flex:1}.pack .pi b{font-size:15px;color:var(--dia)}.pack .pi div{font-size:11.5px;color:var(--sub)}
.badge{position:absolute;top:-7px;left:10px;background:#ff5f7e;color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px}
.ph{opacity:.55}
input.coupon{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:#fff;text-transform:uppercase}
/* modal */
#mwrap{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,#152019,#0c130f);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:20px;text-align:center;margin-bottom:4px}
.modal h2.win{color:#9ef0a8}.modal h2.lose{color:#ff8a8a}
.modal .sub{text-align:center;color:var(--sub);font-size:12.5px;margin-bottom:12px}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.rw div{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.rw div span{color:var(--sub);font-weight:500;font-size:12px;margin-right:auto}
.msgs div{font-size:13px;padding:7px 10px;border-radius:9px;background:color-mix(in srgb,var(--tc) 14%,transparent);margin-bottom:5px;font-weight:700}
.mbtns{display:flex;gap:8px;margin-top:14px}.mbtns .btn{flex:1;padding:12px}
.lore{font-size:14px;line-height:1.8;color:#cfe0d4;text-align:center;margin:10px 0 16px}
/* toast */
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(10,16,12,.94);border:1px solid rgba(255,255,255,.15);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;animation:tin .2s ease-out;max-width:86vw;text-align:center}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .tp{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:flex-start}
.hbtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-weight:800;font-size:13px;flex:none}
.hbtn.on{border-color:var(--tc);color:var(--tc);background:rgba(0,0,0,.6)}
.hst{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px 10px}
.hst .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800}
.hst .t span{color:var(--sub);font-weight:600}
.bar{height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--tc);width:0;transition:width .1s}
#bossBar{position:absolute;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,84vw);text-align:center}
#bossBar .bn{font-size:13px;font-weight:800;color:#ffb3b3;text-shadow:0 1px 4px #000}
#bossBar .bar{height:11px;background:rgba(80,0,0,.55);border:1px solid rgba(255,120,120,.35)}
#bossBar .bar i{background:linear-gradient(90deg,#ff4d4d,#ff9a5c)}
.hhp{position:absolute;left:10px;bottom:calc(16px + env(safe-area-inset-bottom));width:min(280px,52vw)}
.hhp .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hhp .lbl{font-size:12px;font-weight:800;text-shadow:0 1px 3px #000;display:flex;justify-content:space-between}
.hhp .bar{height:11px}.hhp .bar i{background:linear-gradient(90deg,#3fd66b,#a6f07c)}
.skills{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
.skb{pointer-events:auto;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--tc) 55%,#000),#0b0f0c);border:2px solid var(--tc);position:relative;overflow:hidden;font-size:11px;font-weight:800;line-height:1.15;padding:4px;text-shadow:0 1px 2px #000;box-shadow:0 0 14px color-mix(in srgb,var(--tc) 50%,transparent)}
.skb.ult{width:74px;height:74px;border-width:3px}
.skb .cd{position:absolute;inset:0;border-radius:50%}
.skb .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.skb .ky{position:absolute;bottom:5px;left:0;right:0;font-size:9.5px;opacity:.7}
.skb .nm{position:relative}
#hint{position:absolute;left:50%;top:30%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid var(--tc);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:800;text-align:center;max-width:86vw;line-height:1.5}
@media (min-width:900px){.skb{width:72px;height:72px}.skb.ult{width:84px;height:84px}}
</style>
</head>
<body>
<canvas id="cv" class="hidden"></canvas>
<div id="lobby"><div class="shell">
  <div class="top" id="top"></div>
  <div class="content" id="content"></div>
  <div class="nav" id="nav"></div>
</div></div>
<div id="hud" class="hidden">
  <div class="tp">
    <button class="hbtn" data-act="pause">II</button>
    <div class="hst"><div class="t"><b id="hStage"></b><span id="hProgTxt"></span></div><div class="bar"><i id="hProg"></i></div></div>
    <button class="hbtn" id="hAuto" data-act="hauto">자동</button>
    <button class="hbtn" id="hSpd" data-act="hspeed">x1</button>
  </div>
  <div id="bossBar" class="hidden"><div class="bn" id="bossName"></div><div class="bar"><i id="bossHp"></i></div></div>
  <div id="hint" class="hidden"></div>
  <div class="hhp"><div class="lbl"><span id="hLv"></span><span id="hHpTxt"></span></div><div class="bar"><i id="hHp"></i></div></div>
  <div class="skills" id="skills"></div>
</div>
<div id="mwrap" class="hidden"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   드루이드 헌터즈 - 플레이어블 프로토타입
   기획서(druid_deck_hunter_.pptx) 기반. 밸런스 수치는 CONFIG에서 조절.
   ========================================================= */
const CONFIG = {
  maxChapter: 10,               // 정식 출시 목표 10챕터 (MVP 5챕터)
  spPerLevel: 1,
  spPerChapterClear: 3,
  startGold: 100,
  idle: { capHours: 8, killsPerHour: 360, goldRate: 0.6, expRate: 0.5, overflowDia: 20, adMult: 2, comebackHours: 24 },
  // 장비 드랍 확률(%) - 기획서 9p
  drop: { normal: { hero: 0.1, rare: 12, common: 50 }, raidLegend: 0.002 },
  // 옵션 등급 확률(%) / 배율 - 기획서 9p
  optTiers: [
    { name: '하급', p: 97.8, mul: 1.0, color: '#9aa4b1' },
    { name: '중급', p: 1.8, mul: 1.5, color: '#5fd18b' },
    { name: '상급', p: 0.30, mul: 2.0, color: '#4fa3ff' },
    { name: '최상급', p: 0.002, mul: 3.0, color: '#ff5fa2' },
  ],
  pity: 100,                    // 재설정 100회 누적 시 최상급 1개 확정
  reroll: { stone: 10, dia: 5, lockStone: 10, lockDia: 5 },
  respecDia: 50,
  sweepDia: 5,
  invCap: 80,
  monster: { hpBase: 30, atkBase: 10, hpGrowth: 1.12, atkGrowth: 1.09, eliteHp: 10, bossHp: 40 },
  reward: { goldBase: 1.5, goldGrowth: 1.1, expBase: 2, expGrowth: 1.08 },
  raidTickets: 3, raidTime: 60,
};

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

  },
  respecOk() {
    const tech = UI.treeTech || S.tech; if (!S.freeRespec) { if (S.dia < CONFIG.respecDia) { toast('다이아가 부족해요'); return; } S.dia -= CONFIG.respecDia; } else S.freeRespec = false;
    const spent = TREES[tech].reduce((a, n) => a + (S.trees[tech][n.id] || 0) * nodeCost(n, 0).sp, 0); S.sp += spent; S.trees[tech] = {}; save(); closeModal(); renderLobby(); toast(`초기화 완료 · 스킬포인트 ${spent} 환급`);
  },
  item(d) { showItem(+d.uid); },
  close() { closeModal(); },
  equip(d) { const it = itemById(+d.uid); S.equip[it.slot] = it.uid; save(); closeModal(); renderLobby(); toast('장착 완료'); },
  unequip(d) { const it = itemById(+d.uid); S.equip[it.slot] = null; save(); closeModal(); renderLobby(); },
  lock(d) { const it = itemById(+d.uid), o = it.opts[+d.i]; if (!o.lock && it.opts.filter(x => !x.lock).length <= 1) { toast('모든 옵션을 고정할 수는 없어요'); return; } o.lock = !o.lock; save(); showItem(it.uid); },
  reroll(d) {
    const it = itemById(+d.uid), locks = it.opts.filter(o => o.lock).length;
    if (d.c === 'stone') { const c = CONFIG.reroll.stone + locks * CONFIG.reroll.lockStone; if (S.stone < c) { toast('스톤이 부족해요'); return; } S.stone -= c; }
    else { const c = CONFIG.reroll.dia + locks * CONFIG.reroll.lockDia; if (S.dia < c) { toast('다이아가 부족해요'); return; } S.dia -= c; }
    const free = it.opts.filter(o => !o.lock); free.forEach(o => { o.key = pick(OPT_KEYS); o.tier = rollTier(); });
    S.pity++;
    if (free.some(o => o.tier === 3)) S.pity = 0;
    else if (S.pity >= CONFIG.pity) { pick(free).tier = 3; S.pity = 0; toast('천장 발동! 최상급 옵션 확정'); }
    const best = Math.max(...free.map(o => o.tier)); if (best >= 1) toast(`${CONFIG.optTiers[best].name} 옵션 등장!`);
    S.daily.growth = 1; save(); showItem(it.uid); renderTop();
  },
  enh(d) {
    const it = itemById(+d.uid), ec = 2 + it.enh * 2, eg = 100 * (it.enh + 1), rate = Math.max(40, 100 - it.enh * 5);
    if (it.enh >= GRADES[it.grade].maxEnh) return; if (S.stone < ec) { toast('스톤이 부족해요'); return; } if (S.gold < eg) { toast('골드가 부족해요'); return; }
    S.stone -= ec; S.gold -= eg; S.daily.growth = 1;
    if (Math.random() * 100 < rate) { it.enh++; toast(`강화 성공! +${it.enh}`); } else toast('강화 실패... 재료만 소모됐어요');
    save(); showItem(it.uid); renderTop();
  },
  dis(d) { const it = itemById(+d.uid); if (SLOTS.some(s => S.equip[s] === it.uid)) return; S.inv = S.inv.filter(x => x !== it); const g = GRADES[it.grade].dis + Math.floor(it.enh / 2); S.stone += g; save(); closeModal(); renderLobby(); toast(`분해 완료 · 스톤 +${g}`); },
  disall() { const eqs = new Set(SLOTS.map(s => S.equip[s])); const tgt = S.inv.filter(i => i.grade === 0 && !eqs.has(i.uid)); if (!tgt.length) { toast('분해할 일반 장비가 없어요'); return; } S.inv = S.inv.filter(i => !tgt.includes(i)); S.stone += tgt.length * GRADES[0].dis; save(); renderLobby(); toast(`일반 장비 ${tgt.length}개 분해 · 스톤 +${tgt.length}`); },
  autoequip() {
    let changed = 0;
    for (const s of SLOTS) { let best = S.equip[s], bp = powerOf(computeStats()); for (const it of S.inv.filter(i => i.slot === s)) { const c = Object.assign({}, S.equip, { [s]: it.uid }), p = powerOf(computeStats(null, c)); if (p > bp) { bp = p; best = it.uid; } } if (best !== S.equip[s]) { S.equip[s] = best; changed++; } }
    save(); renderLobby(); toast(changed ? `${changed}개 부위 교체 · 전투력 ${fmt(curPower())}` : '이미 최적 장비를 착용 중이에요');
  },
  probs() { showModal(`<h2>확률 정보</h2><div class="sub">확률형 아이템 정보 상시 공개</div>${probTables()}<div class="mbtns"><button class="btn" data-act="close">닫기</button></div>`); },
  upg(d) { let n = +d.n, done = 0; while (n-- > 0) { const c = UPG[d.k].cost(S.upg[d.k]); if (S.gold < c) break; S.gold -= c; S.upg[d.k]++; done++; } if (!done) { toast('골드가 부족해요'); return; } save(); renderLobby(); },
  attend() {
    const an = attendNext(); if (an.claimed) return; S.attend.streak = S.attend.last === yesterday() ? S.attend.streak + 1 : 1; S.attend.last = ymd();
    const r = ATTEND[(S.attend.streak - 1) % 7], msgs = []; grant(r, msgs); save(); renderLobby(); toast(`출석 ${S.attend.streak}일차 보상: ${r.t}`); msgs.forEach(m => toast(m));
  },
  quest(d) {
    if (d.id === 'all') { if (S.daily.claimed.all || !DAILY.every(q => S.daily.claimed[q.id])) return; S.daily.claimed.all = true; grant({ dia: 50 }); toast('보상 수령: 다이아 50'); }
    else { const q = DAILY.find(x => x.id === d.id); if ((S.daily[q.id] || 0) < q.goal || S.daily.claimed[q.id]) return; S.daily.claimed[q.id] = true; grant(q.r); toast('보상 수령: ' + rewardText(q.r)); }
    save(); renderLobby();
  },
  raid() { if (S.raid.tickets <= 0 || S.cleared < 9) return; S.raid.tickets--; save(); startBattle({ raid: true }); },
  buy(d) {
    const p = PACKS.find(x => x.id === d.id), dia = p.dia * (S.shop.firstBuy ? 1 : 2);
    showModal(`<h2>구매 시뮬레이션</h2><div class="sub">프로토타입이라 실제 결제는 일어나지 않아요</div><div class="lore">다이아 ${fmt(dia)} ${!S.shop.firstBuy ? '(첫 결제 2배)' : ''}<br>₩${fmt(p.price)}</div><div class="mbtns"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="buyOk" data-id="${p.id}">구매(가상)</button></div>`);
  },
  buyOk(d) { const p = PACKS.find(x => x.id === d.id), dia = p.dia * (S.shop.firstBuy ? 1 : 2), v0 = vipLevel(); S.dia += dia; S.shop.firstBuy = true; S.shop.spent += p.price; save(); closeModal(); renderLobby(); toast(`다이아 ${fmt(dia)} 지급`); if (vipLevel() > v0) toast(`VIP ${vipLevel()} 달성! 방치 보상 상한 ${idleCap()}시간`); },
  adDia() { if ((S.daily.ads || 0) >= 5) return; fakeAd(() => { S.daily.ads = (S.daily.ads || 0) + 1; S.dia += 10; save(); renderLobby(); toast('다이아 10 지급'); }); },
  coupon() {
    const code = ($('#coupon').value || '').trim().toUpperCase(), c = COUPONS[code];
    if (!c) { toast('유효하지 않은 쿠폰 코드예요'); return; } if (S.coupons[code]) { toast('이미 사용한 쿠폰이에요'); return; }
    S.coupons[code] = true; const msgs = []; grant(c, msgs); save(); renderLobby(); toast(`쿠폰 사용: ${c.label}`); msgs.forEach(m => toast(m));
  },
  dev(d) {
    const k = d.k;
    if (k === 'idle') S.idleAt -= 3600000; else if (k === 'idle8') S.idleAt -= 36000000;
    else if (k === 'gold') S.gold += 100000; else if (k === 'stone') S.stone += 500; else if (k === 'dia') S.dia += 1000; else if (k === 'sp') S.sp += 10;
    else if (k === 'ch') { const before = S.cleared; S.cleared = Math.min(CONFIG.maxChapter * 10 - 1, Math.floor((S.cleared + 1) / 10) * 10 + 9); if (before < 0) S.idleAt = Date.now(); if (S.tut < 3) S.tut = 3; TECH_ORDER.forEach(id => { if (TECH[id].unlockCh > 0 && TECH[id].unlockCh * 10 - 1 > before && techUnlocked(id)) toast(`새 테크 해금: ${TECH[id].name}`); }); }
    else if (k === 'legend') { const it = makeItem(3, Math.max(0, S.cleared)); addItem(it); toast(`[전설] ${itemName(it)} 지급`); }
    else if (k === 'ticket') S.raid.tickets = CONFIG.raidTickets;
    else if (k === 'reset') { showModal(`<h2>데이터 초기화</h2><div class="sub">모든 진행 상황이 삭제돼요</div><div class="mbtns"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="resetOk">초기화</button></div>`); return; }
    save(); renderLobby(); if (k.startsWith('idle')) toast('방치 시간 경과 처리 · 사냥 탭에서 수령하세요');
  },
  resetOk() { localStorage.removeItem(SAVE_KEY); location.reload(); },
  pause() { togglePause(); }, resume() { togglePause(); },
  giveup() { if (!B) return; if (B.raid) { B.paused = false; closeModal(); B.raidLeft = 0; return; } B.paused = false; closeModal(); endBattle(false); },
  hauto() { S.settings.auto = !S.settings.auto; save(); $('#hAuto').classList.toggle('on', S.settings.auto); toast(S.settings.auto ? '자동 전투 ON · 이동/스킬 자동, 직접 조작하면 즉시 수동' : '자동 전투 OFF'); },
  hspeed() { S.settings.speed = S.settings.speed === 1 ? 2 : 1; save(); $('#hSpd').textContent = 'x' + S.settings.speed; $('#hSpd').classList.toggle('on', S.settings.speed > 1); },
  skill() { },
  'res-retry'() { if (B && B.autoTimer) clearInterval(B.autoTimer); const o = { ch: B.ch, st: B.st }; closeModal(); startBattle(o); },
  'res-next'() { if (B && B.autoTimer) clearInterval(B.autoTimer); const g = B.g + 1; if (g > S.cleared + 1) { ACT['res-retry'](); return; } const c = gToCS(g); S.sel = c; closeModal(); startBattle(c); },
  'res-lobby'() { leaveBattle(); },
  intro() { startBattle({ ch: 1, st: 1 }); },
};

/* ---------- main loop ---------- */
let last = performance.now(), idleTick = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (B) { if (!B.paused) { const n = S.settings.speed || 1; for (let i = 0; i < n; i++) update(dt); } render(now); hudUpdate(); }
  else if (UI.tab === 'home') { drawPreview(now / 1000); if (now - idleTick > 1000) { idleTick = now; const el = $('#idleBox'); if (el) el.innerHTML = idleBoxHtml(); } }
  requestAnimationFrame(loop);
}
function boot() {
  load(); resize();
  const away = Date.now() - S.lastSeen;
  refreshPeriodic(); renderLobby();
  if (S.tut === 0) {
    showModal(`<h2 style="color:${TECH.beast.color}">드루이드 헌터즈</h2><div class="sub">사냥 × 육성 하이브리드 방치형 RPG · 프로토타입</div>
      <div class="lore">자연의 힘을 빌려 형태를 바꾸는 드루이드.<br>타락한 숲을 되찾기 위해, 첫 번째 형태 <b style="color:${TECH.beast.color}">짐승</b>으로 사냥을 시작한다.</div>
      <div class="mbtns"><button class="btn" data-act="intro">건너뛰기</button><button class="btn pri" data-act="intro">사냥 시작</button></div>`, { closable: false });
  } else if (S.tut === 1) { UI.tab = 'tree'; UI.treeTech = 'beast'; renderLobby(); }
  else if (away > 60000) showOffline();
  setInterval(() => { if (!B) save(); }, 10000);
  addEventListener('beforeunload', save);
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
